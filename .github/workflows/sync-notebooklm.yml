name: Sync Obsidian NotebookLM Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    paths:
      - 'Obsidian_Master.txt'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Forcar sync mesmo sem mudancas'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: obsidian-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GOOGLE_CLIENT_ID:        ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET:    ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN:    ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      OBSIDIAN_VAULT_FOLDER_ID: ${{ secrets.OBSIDIAN_VAULT_FOLDER_ID }}
      NOTEBOOKLM_NOTEBOOK_ID:  ${{ secrets.NOTEBOOKLM_NOTEBOOK_ID }}
      NOTEBOOKLM_OUTPUTS_FOLDER_ID: ${{ secrets.NOTEBOOKLM_OUTPUTS_FOLDER_ID }}
      NOTEBOOKLM_AUTH_JSON:  ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
      BLOGGER_BLOG_ID: "5982274115355506187"
      PYTHONPATH: ${{ github.workspace }}/scripts

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          echo "Dependencias instaladas"

      - name: Extrair Post ID do Obsidian_Master.txt
        id: extract
        if: github.event_name == 'push'
        run: |
          if [ -f "Obsidian_Master.txt" ]; then
            POST_ID=$(grep -m1 'Post ID:' Obsidian_Master.txt | sed 's/.*Post ID: //' | tr -d ' ')
            if [ -n "$POST_ID" ]; then
              echo "post_id=$POST_ID" >> $GITHUB_OUTPUT
              echo "Post ID encontrado: $POST_ID"
            else
              echo "Nenhum Post ID encontrado"
            fi
          fi

      - name: Restaurar estado da ultima sincronizacao
        uses: actions/cache@v4
        with:
          path: .last_sync.json
          key: sync-state-${{ github.run_id }}
          restore-keys: |
            sync-state-

      - name: Verificar mudancas no Obsidian_Master.txt
        id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "last_modified=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
            echo "Push detectado"
          elif [ "${{ inputs.force_sync }}" = "true" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Sync forado pelo usuario"
          else
            python scripts/check_changes.py
          fi

      - name: Sync NotebookLM
        id: sync_nlm
        if: steps.check.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          python scripts/sync_to_notebooklm.py \
            --notebook-id "$NOTEBOOKLM_NOTEBOOK_ID"

      - name: Gerar Audio Overview
        id: gen_audio
        if: steps.check.outputs.has_changes == 'true' && steps.sync_nlm.conclusion == 'success'
        continue-on-error: true
        run: |
          python scripts/save_notebooklm_video.py generate-audio \
            "Resuma os principais topicos de forma clara e envolvente"

      - name: Gerar Video Overview
        id: gen_video
        if: steps.check.outputs.has_changes == 'true' && steps.sync_nlm.conclusion == 'success'
        continue-on-error: true
        run: |
          python scripts/save_notebooklm_video.py generate-video \
            "Crie um video resumindo os principais insights das fontes"

      - name: Salvar outputs no Drive
        id: save_outputs
        if: steps.check.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          python scripts/save_notebooklm_outputs.py \
            --folder-id "$OBSIDIAN_VAULT_FOLDER_ID"

      - name: Baixar medias para o Drive
        id: download_media
        if: >
          steps.check.outputs.has_changes == 'true' &&
          (steps.gen_audio.outcome == 'success' || steps.gen_video.outcome == 'success')
        continue-on-error: true
        run: |
          python scripts/save_notebooklm_video.py download

      - name: Upload YouTube e atualizar Blog
        id: youtube
        if: steps.download_media.outcome == 'success'
        continue-on-error: true
        run: |
          echo "Procurando video no Drive..."
          python -c "
          from drive_client import DriveClient
          import os, json, sys
          dc = DriveClient()
          folder_id = os.getenv('NOTEBOOKLM_OUTPUTS_FOLDER_ID', '1Eikf5MOwCNopr-FS976lheYlUprvWEx-')
          files = dc.list_files(folder_id)
          videos = [f for f in files if f['name'].endswith(('.mp4', '.webm', '.mov'))]
          if not videos:
              print('Nenhum video encontrado no Drive')
              sys.exit(1)
          latest = max(videos, key=lambda f: f.get('modifiedTime', ''))
          print('Video encontrado:', latest['name'], '(ID:', latest['id'], ')')
          raw = dc.service.files().get_media(fileId=latest['id']).execute()
          with open('/tmp/video_notebooklm.mp4', 'wb') as fp:
              fp.write(raw)
          print('Video baixado para /tmp/video_notebooklm.mp4')
          with open('/tmp/video_info.json', 'w') as fp:
              json.dump({'file_id': latest['id'], 'name': latest['name']}, fp)
          "
          if [ -f /tmp/video_notebooklm.mp4 ]; then
            TITLE=$(head -1 Obsidian_Master.txt 2>/dev/null | sed 's/^# Post: //' || echo "Video @CanalQb")
            echo "Enviando video para YouTube (privado)..."
            python scripts/youtube_uploader.py \
              --file /tmp/video_notebooklm.mp4 \
              --title "$TITLE" \
              --description "Video gerado automaticamente pelo NotebookLM para @CanalQb" \
              --tags "@CanalQb,automacao,NotebookLM" \
              --privacy "private" 2>&1 | tee /tmp/youtube_result.txt
            VIDEO_ID=$(grep -oP '"video_id": "\K[^"]+' /tmp/youtube_result.txt || echo "")
            if [ -n "$VIDEO_ID" ]; then
              echo "VIDEO_ID=$VIDEO_ID" >> $GITHUB_ENV
              POST_ID="${{ steps.extract.outputs.post_id }}"
              if [ -n "$POST_ID" ]; then
                echo "Atualizando post do Blogger..."
                python -c "
                from blogger_client import BloggerClient
                bc = BloggerClient()
                result = bc.add_youtube_embed(
                    blog_id='5982274115355506187',
                    post_id='$POST_ID',
                    video_id='$VIDEO_ID',
                    video_title='$TITLE',
                )
                print('Post atualizado:', result.get('url', ''))
                "
              fi
            fi
          fi

      - name: Salvar estado da sincronizacao
        if: steps.check.outputs.has_changes == 'true' && steps.sync_nlm.conclusion == 'success'
        uses: actions/cache/save@v4
        with:
          path: .last_sync.json
          key: sync-state-${{ github.run_id }}

      - name: Resumo final
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Resultados do Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Detectar mudancas | ${{ steps.check.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Sync NotebookLM | ${{ steps.sync_nlm.outcome || 'pulado' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gerar Audio | ${{ steps.gen_audio.outcome || 'pulado' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gerar Video | ${{ steps.gen_video.outcome || 'pulado' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Salvar outputs | ${{ steps.save_outputs.outcome || 'pulado' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Download media | ${{ steps.download_media.outcome || 'pulado' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| YouTube Upload | ${{ steps.youtube.outcome || 'pulado' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Post ID: ${{ steps.extract.outputs.post_id || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "Video ID: ${{ env.VIDEO_ID || 'N/A' }}" >> $GITHUB_STEP_SUMMARY

      - name: Notificar falha
        if: failure()
        run: |
          echo "Pipeline falhou!" >> $GITHUB_STEP_SUMMARY
          echo "Verifique os logs acima" >> $GITHUB_STEP_SUMMARY
